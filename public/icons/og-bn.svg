<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="45%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#065f46" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Subtle Glow Orbs -->
  <circle cx="200" cy="150" r="180" fill="#10b981" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1050" cy="500" r="220" fill="#14b8a6" opacity="0.1" filter="url(#glow)"/>

  <!-- Main Container Card -->
  <rect x="60" y="50" width="1080" height="530" rx="28" fill="url(#cardGrad)" stroke="#10b981" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Logo Icon -->
  <g transform="translate(110, 100) scale(1.1)">
    <rect width="100" height="100" rx="24" fill="#059669" stroke="#34d399" stroke-width="3"/>
    <path d="M50 18c22 10 34 32 27 54-4 15-18 23-27 26-9-3-23-11-27-26C16 50 28 28 50 18z" fill="#ecfdf5"/>
    <path d="M50 26v44" stroke="#047857" stroke-width="4" stroke-linecap="round"/>
    <path d="M51 42c10 4 16 12 18 20M51 55c-9 4-15 10-17 16" stroke="#047857" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Header Text -->
  <text x="245" y="145" fill="#34d399" font-size="18" font-family="'Hind Siliguri', system-ui, sans-serif" font-weight="700" letter-spacing="2">ডিএই অফিসিয়াল রেফারেন্স ভিত্তিক ডিজিটাল প্ল্যাটফর্ম</text>
  <text x="245" y="195" fill="#ffffff" font-size="52" font-family="'Hind Siliguri', 'Noto Serif Bengali', serif" font-weight="900">এগ্রিকেম প্রো (AgriChem Pro)</text>
  <text x="110" y="260" fill="#a7f3d0" font-size="24" font-family="'Hind Siliguri', system-ui, sans-serif" font-weight="500">আধুনিক ফসলের বালাই ব্যবস্থাপনা, সঠিক রাসায়নিক প্রয়োগ ও মাঠ মাত্রা ক্যালকুলেটর</text>

  <!-- 6 Features Badges Grid -->
  <g transform="translate(110, 305)">
    <!-- Feature 1: Database -->
    <rect x="0" y="0" width="310" height="85" rx="14" fill="#022c22" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle cx="35" cy="42" r="18" fill="#065f46"/>
    <text x="35" y="47" fill="#34d399" font-size="18" text-anchor="middle">🧪</text>
    <text x="65" y="36" fill="#ffffff" font-size="16" font-family="system-ui, sans-serif" font-weight="700">রাসায়নিক ডাটাবেস</text>
    <text x="65" y="58" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">৭০+ ডিএই অনুমোদিত বালাইনাশক</text>

    <!-- Feature 2: Calculator -->
    <rect x="330" y="0" width="310" height="85" rx="14" fill="#022c22" stroke="#14b8a6" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle cx="365" cy="42" r="18" fill="#0f766e"/>
    <text x="365" y="47" fill="#5eead4" font-size="18" text-anchor="middle">🧮</text>
    <text x="395" y="36" fill="#ffffff" font-size="16" font-family="system-ui, sans-serif" font-weight="700">মাত্রা ক্যালকুলেটর</text>
    <text x="395" y="58" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">১৬L ন্যাপস্যাক ও শতক/বিঘা হিসাব</text>

    <!-- Feature 3: MoA Rotation -->
    <rect x="660" y="0" width="310" height="85" rx="14" fill="#022c22" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle cx="695" cy="42" r="18" fill="#1e40af"/>
    <text x="695" y="47" fill="#93c5fd" font-size="18" text-anchor="middle">🔄</text>
    <text x="725" y="36" fill="#ffffff" font-size="16" font-family="system-ui, sans-serif" font-weight="700">MoA ঘূর্ণন পরিকল্পনা</text>
    <text x="725" y="58" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">IRAC/FRAC প্রতিরোধ দমন কৌশল</text>

    <!-- Feature 4: Safety & PPE -->
    <rect x="0" y="105" width="310" height="85" rx="14" fill="#022c22" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle cx="35" cy="147" r="18" fill="#78350f"/>
    <text x="35" y="152" fill="#fcd34d" font-size="18" text-anchor="middle">🛡️</text>
    <text x="65" y="141" fill="#ffffff" font-size="16" font-family="system-ui, sans-serif" font-weight="700">WHO নিরাপত্তা ও পিপিই</text>
    <text x="65" y="163" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">বিপদ কালার ব্যান্ড ও জরুরি চিকিৎসা</text>

    <!-- Feature 5: Guidebook -->
    <rect x="330" y="105" width="310" height="85" rx="14" fill="#022c22" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle cx="365" cy="147" r="18" fill="#15803d"/>
    <text x="365" y="152" fill="#86efac" font-size="18" text-anchor="middle">📖</text>
    <text x="395" y="141" fill="#ffffff" font-size="16" font-family="system-ui, sans-serif" font-weight="700">ফিল্ড পকেট বুক (PDF)</text>
    <text x="395" y="163" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">W.A.L.E.S. ট্যাংক মিশ্রণের নিয়ম</text>

    <!-- Feature 6: Offline PWA -->
    <rect x="660" y="105" width="310" height="85" rx="14" fill="#022c22" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle cx="695" cy="147" r="18" fill="#0e7490"/>
    <text x="695" y="152" fill="#67e8f9" font-size="18" text-anchor="middle">⚡</text>
    <text x="725" y="141" fill="#ffffff" font-size="16" font-family="system-ui, sans-serif" font-weight="700">১০০% অফলাইন সুবিধা</text>
    <text x="725" y="163" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">ইন্টারনেট ছাড়াই মাঠে ব্যবহারযোগ্য</text>
  </g>

  <!-- Bottom Bar -->
  <text x="110" y="545" fill="#6ee7b7" font-size="14" font-family="monospace">DAE • IRAC • FRAC • HRAC • WHO HAZARD GUIDELINES</text>
  <text x="970" y="545" fill="#34d399" font-size="14" font-family="system-ui, sans-serif" font-weight="700">বিনামূল্যে ব্যবহার করুন ➔</text>
</svg>
