<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Brand palette: Bangladesh flag green + red, plus deep ink for depth -->
    <linearGradient id="bgGradEn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00281b"/>
      <stop offset="45%" stop-color="#003327"/>
      <stop offset="100%" stop-color="#001a14"/>
    </linearGradient>
    <linearGradient id="cardGradEn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#006a4e" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#004f3a" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="logoBgEn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00805f"/>
      <stop offset="100%" stop-color="#00553f"/>
    </linearGradient>
    <filter id="glowEn" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <!-- Reusable brand logo: flask + leaf inside a Bangladesh-green rounded
         square with the Bangladesh red circle. Matches favicon.svg exactly. -->
    <symbol id="brandLogoEn" viewBox="0 0 512 512">
      <rect width="512" height="512" rx="112" fill="url(#logoBgEn)"/>
      <circle cx="236" cy="256" r="130" fill="#f42a41"/>
      <g fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
        <path d="M216 110 h80 M256 110 v80 M180 390 h152 M216 110 v110 L130 390 A 20 20 0 0 0 148 410 h216 a 20 20 0 0 0 18 -20 L296 220 V110" />
        <path d="M256 220 C290 260 290 320 256 360 C222 320 222 260 256 220 Z" fill="#ffffff" fill-opacity="0.25" />
        <path d="M256 220 V360" stroke-width="16" />
        <path d="M256 270 C270 280 275 295 275 295 M256 300 C238 310 235 325 235 325" stroke-width="16" />
      </g>
    </symbol>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradEn)"/>

  <!-- Subtle Glow Orbs in brand red + brand green -->
  <circle cx="200" cy="150" r="180" fill="#f42a41" opacity="0.08" filter="url(#glowEn)"/>
  <circle cx="1050" cy="500" r="220" fill="#006a4e" opacity="0.14" filter="url(#glowEn)"/>

  <!-- Main Container Card (brand green stroke) -->
  <rect x="60" y="50" width="1080" height="530" rx="28" fill="url(#cardGradEn)" stroke="#006a4e" stroke-width="2" stroke-opacity="0.55"/>

  <!-- Brand Logo (replaces the old generic leaf-on-emerald icon) -->
  <use href="#brandLogoEn" x="110" y="100" width="110" height="110"/>

  <!-- Header Text — Plus Jakarta Sans / system-ui for English -->
  <text x="245" y="148" fill="#7dd3a8" font-size="16" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" letter-spacing="2">DAE OFFICIAL REFERENCE &amp; RESISTANCE SUITE</text>
  <text x="245" y="200" fill="#ffffff" font-size="54" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900">AgriChem Pro</text>
  <text x="110" y="262" fill="#a7f3d0" font-size="22" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="500">Precision Crop Protection, Knapsack Dosage Math &amp; Resistance Rotation Guide</text>

  <!-- 6 Features Badges Grid (brand-aligned accents) -->
  <g transform="translate(110, 305)" font-family="'Plus Jakarta Sans', system-ui, sans-serif">
    <!-- Feature 1: Database -->
    <rect x="0" y="0" width="310" height="85" rx="14" fill="#00281b" stroke="#006a4e" stroke-width="1.5" stroke-opacity="0.6"/>
    <circle cx="35" cy="42" r="18" fill="#004f3a"/>
    <text x="35" y="48" fill="#7dd3a8" font-size="18" text-anchor="middle">🧪</text>
    <text x="65" y="36" fill="#ffffff" font-size="16" font-weight="700">Chemical Database</text>
    <text x="65" y="58" fill="#94a3b8" font-size="12">70+ DAE Approved Formulations</text>

    <!-- Feature 2: Calculator (brand red accent) -->
    <rect x="330" y="0" width="310" height="85" rx="14" fill="#00281b" stroke="#f42a41" stroke-width="1.5" stroke-opacity="0.45"/>
    <circle cx="365" cy="42" r="18" fill="#7a1a26"/>
    <text x="365" y="48" fill="#fca5a5" font-size="18" text-anchor="middle">🧮</text>
    <text x="395" y="36" fill="#ffffff" font-size="16" font-weight="700">Dosage Calculator</text>
    <text x="395" y="58" fill="#94a3b8" font-size="12">16L/20L Knapsack Sprayer Math</text>

    <!-- Feature 3: MoA Rotation -->
    <rect x="660" y="0" width="310" height="85" rx="14" fill="#00281b" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle cx="695" cy="42" r="18" fill="#1e40af"/>
    <text x="695" y="48" fill="#93c5fd" font-size="18" text-anchor="middle">🔄</text>
    <text x="725" y="36" fill="#ffffff" font-size="16" font-weight="700">MoA Resistance Planner</text>
    <text x="725" y="58" fill="#94a3b8" font-size="12">IRAC/FRAC Rotation Schedules</text>

    <!-- Feature 4: Safety & PPE (brand amber accent) -->
    <rect x="0" y="105" width="310" height="85" rx="14" fill="#00281b" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle cx="35" cy="147" r="18" fill="#78350f"/>
    <text x="35" y="153" fill="#fcd34d" font-size="18" text-anchor="middle">🛡️</text>
    <text x="65" y="141" fill="#ffffff" font-size="16" font-weight="700">WHO Safety &amp; PPE</text>
    <text x="65" y="163" fill="#94a3b8" font-size="12">Hazard Bands &amp; First Aid Guides</text>

    <!-- Feature 5: Guidebook -->
    <rect x="330" y="105" width="310" height="85" rx="14" fill="#00281b" stroke="#006a4e" stroke-width="1.5" stroke-opacity="0.6"/>
    <circle cx="365" cy="147" r="18" fill="#00553f"/>
    <text x="365" y="153" fill="#86efac" font-size="18" text-anchor="middle">📖</text>
    <text x="395" y="141" fill="#ffffff" font-size="16" font-weight="700">Field Pocket Book</text>
    <text x="395" y="163" fill="#94a3b8" font-size="12">Printable A5 PDF &amp; W.A.L.E.S.</text>

    <!-- Feature 6: Offline PWA -->
    <rect x="660" y="105" width="310" height="85" rx="14" fill="#00281b" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle cx="695" cy="147" r="18" fill="#0e7490"/>
    <text x="695" y="153" fill="#67e8f9" font-size="18" text-anchor="middle">⚡</text>
    <text x="725" y="141" fill="#ffffff" font-size="16" font-weight="700">100% Offline Ready</text>
    <text x="725" y="163" fill="#94a3b8" font-size="12">Works without field connectivity</text>
  </g>

  <!-- Bottom Bar -->
  <text x="110" y="545" fill="#6ee7b7" font-size="14" font-family="monospace">DAE • IRAC • FRAC • HRAC • WHO TOXICITY STANDARDS</text>
  <text x="960" y="545" fill="#7dd3a8" font-size="14" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700">Open Free Tool ➔</text>
</svg>
